# Terraform pipeline. Plan on every merge request, apply manually from main.
#
# Credentials come from GitLab OIDC - no long-lived AWS keys in CI variables.
# The assumed role carries iam/terraform-deploy-policy.json.

stages:
  - build
  - validate
  - plan
  - apply

variables:
  TF_ROOT: terraform
  TF_VAR_FILE: prod.tfvars
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-southeast-1
  AWS_DEFAULT_REGION: ap-southeast-1
  # Set AWS_ROLE_ARN as a project CI/CD variable, e.g.
  # arn:aws:iam::111122223333:role/websg-terraform-deploy

# The zip archive_file builds is resolved at plan time, so the package must
# exist before Terraform runs - in build, not as a side effect of plan.
package:
  stage: build
  image: node:24-alpine
  script:
    - cd lambda
    - npm ci
    - npm run package
  artifacts:
    paths:
      - lambda/build/
    expire_in: 1 day

.terraform:
  image:
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  before_script:
    # GitLab mints the token; the AWS provider picks it up from these two
    # variables and calls AssumeRoleWithWebIdentity itself.
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/web_identity_token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web_identity_token
    - cd "$TF_ROOT"
    - terraform init -input=false
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  cache:
    key: terraform
    paths:
      - $TF_ROOT/.terraform

validate:
  extends: .terraform
  stage: validate
  needs: [package]
  dependencies: [package]
  script:
    - terraform fmt -check -recursive
    - terraform validate

plan:
  extends: .terraform
  stage: plan
  needs: [validate, package]
  dependencies: [package]
  script:
    - terraform plan -input=false -var-file="$TF_VAR_FILE" -out=tfplan
    - terraform show -no-color tfplan > plan.txt
  artifacts:
    paths:
      - $TF_ROOT/tfplan
      - $TF_ROOT/plan.txt
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:
  extends: .terraform
  stage: apply
  needs: [plan, package]
  dependencies: [plan, package]
  # Applies the reviewed plan file, not a fresh one - what was approved is
  # exactly what runs.
  script:
    - terraform apply -input=false tfplan
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
